# Development:      docker compose up            (host port: APP_PORT, default 3000)
# Production build: docker compose --profile prod up prod   (host port: PROD_PORT, default 3001)
# Unit tests:       docker compose run --rm --no-deps app yarn test
# Browser tests:    docker compose --profile test run --rm e2e

x-node: &node
  image: node:24-slim
  working_dir: /app
  environment:
    NUXT_TELEMETRY_DISABLED: 1
  volumes:
    - .:/app
    # Keep container dependencies and build artifacts apart from the host ones.
    - node_modules:/app/node_modules
    - nuxt:/app/.nuxt

services:
  app:
    <<: *node
    command: sh -c "yarn install --frozen-lockfile && yarn dev --host 0.0.0.0 --port 3000"
    ports:
      - "${APP_PORT:-3000}:3000"
      - "24678:24678" # Vite HMR websocket

  prod:
    <<: *node
    profiles: [prod, test]
    working_dir: /build
    # Builds from a copy of the sources, so nothing is written to the host checkout.
    command: >
      sh -c "tar -C /src --exclude=./node_modules --exclude=./.nuxt --exclude=./.output --exclude=./.git -cf - . | tar -C /build -xf -
      && yarn install --frozen-lockfile && yarn build && node .output/server/index.mjs"
    environment:
      NUXT_TELEMETRY_DISABLED: 1
      HOST: 0.0.0.0
      PORT: 3001
    volumes:
      - .:/src:ro
      - node_modules:/build/node_modules
    ports:
      - "${PROD_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/contacto').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      start_period: 10m

  e2e:
    # Must match the @playwright/test version in package.json.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [test]
    working_dir: /app
    command: npx playwright test
    environment:
      BASE_URL: http://prod:3001
      PLAYWRIGHT_OUTPUT_DIR: /tmp/test-results
    volumes:
      - .:/app:ro
      - node_modules:/app/node_modules
    depends_on:
      prod:
        condition: service_healthy

volumes:
  node_modules:
  nuxt:
